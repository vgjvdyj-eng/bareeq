name: bareeq
description: "Bareeq - منصة تربط بين المستضيفين ومقدمي الخدمات"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  
  # Navigation and Routing
  go_router: ^10.0.0
  
  # HTTP and Networking
  http: ^1.1.0
  dio: ^5.3.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # JSON Serialization
  json_annotation: ^4.8.0
  
  # Date and Time
  intl: ^0.19.0
  
  # UI Components
  flutter_svg: ^2.0.0
  flutter_screenutil: ^5.9.0
  
  # Form Validation
  email_validator: ^2.1.0
  
  # Image Picker
  image_picker: ^1.0.0
  
  # Location
  geolocator: ^9.0.0
  
  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
